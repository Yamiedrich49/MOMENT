<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="description" content="重さと距離を指先で感じる、500ステージのてこパズル。">
<title>MOMENT — てこで、ぴたり。</title>
<style>
:root{--paper:#f5f6f2;--ink:#15333b;--sub:#71858a;--deep:#0c2933;--deep2:#102e38;--teal:#19c6b1;--teal2:#e4faf5;--gold:#ffba6a;--line:#dfe9e6;--white:#fff;--easing:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.app{width:min(100%,650px);margin:auto;min-height:100svh;display:flex;flex-direction:column;padding:calc(17px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:47px}
.brand{display:flex;align-items:center;gap:11px}.emblem{height:44px;width:44px;display:grid;place-items:center;background:var(--deep);border-radius:15px;box-shadow:0 6px 16px #13354124}.emblem svg{width:30px}
.brand h1{font-size:20px;font-weight:950;letter-spacing:.16em;line-height:1;margin:0}.brand span{display:block;margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.26em;color:#87979b}
.top-actions{display:flex;gap:8px}.tool{width:42px;height:42px;display:grid;place-items:center;border:1px solid #e2e9e5;border-radius:14px;background:#fff;color:#36565d;box-shadow:0 2px 5px #19303908}.tool svg{width:19px;height:19px;stroke-width:1.9}
.heading{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:22px 0 13px}.eyebrow{color:#189e94;font-size:10px;letter-spacing:.13em;font-weight:950}.heading h2{font-size:clamp(23px,5.6vw,29px);letter-spacing:-.06em;line-height:1.2;margin:7px 0 5px;font-weight:950}.heading p{font-size:11px;color:#89989a;font-weight:750;margin:0}.stage-mark{text-align:right;flex:none}.stage-mark small{display:block;font-size:10px;letter-spacing:.15em;color:#84989a;font-weight:850}.stage-mark strong{font-size:28px;letter-spacing:-.075em;font-weight:950;font-variant-numeric:tabular-nums}.stage-mark em{font-size:12px;font-style:normal;font-weight:800;color:#b1c1bf}.progress{height:4px;border-radius:9px;background:#e0e8e4;overflow:hidden;margin-bottom:13px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#79ddd1,#0bb8aa);width:0;transition:width .35s var(--easing)}

.success-banner .sparkle{display:grid;place-items:center;width:43px;height:43px;background:#c5fcea;color:#086e65;border-radius:50%;box-shadow:0 0 30px #52eedc4a;font-size:23px;font-weight:900}.success-banner strong{font-size:25px;font-weight:950;color:#e5fff7;letter-spacing:.05em;text-shadow:0 4px 15px #001b2299}.success-banner small{color:#7ce9d5;font-size:11px;font-weight:850;letter-spacing:.09em}

.supply-title{width:65px;flex:none;font-size:10px;letter-spacing:.05em;line-height:1.7;font-weight:850;color:#9aabae}.supply-title strong{font-size:12px;color:#314f56;display:block;letter-spacing:0}.tray{display:flex;flex:1;align-items:center;justify-content:center;gap:12px;min-height:67px}
.weight{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid #67dccf;width:58px;height:58px;border-radius:18px;color:#08756d;background:linear-gradient(155deg,#dbfff5,#a3f1e3);box-shadow:inset 0 3px #fff9,inset 0 -5px #00ac9d2b,0 5px 0 #a4ddd3,0 9px 13px #194d4518;touch-action:none;user-select:none;transition:transform .14s var(--easing),opacity .2s,background .2s;flex:none}
.weight .num{font-size:25px;font-weight:950;line-height:1;letter-spacing:-.06em}.weight .dots{display:flex;gap:4px;margin-top:5px}.weight .dots i{width:4px;height:4px;background:#0cafa1;border-radius:50%}
.weight.selected{background:linear-gradient(155deg,#eafff7,#6fe9d5);border-color:#079c8f;transform:translateY(-5px);box-shadow:inset 0 3px #fff9,0 7px 0 #58cbbd,0 13px 16px #0d706b28;outline:2px solid #14bbac;outline-offset:4px}
.weight.used{opacity:.24;box-shadow:none;background:#edf3f1;border-color:#cbded8;transform:scale(.93);pointer-events:none}
.supply-hint{flex:none;width:53px;color:#9aafae;font-size:10px;font-weight:850;line-height:1.65;text-align:right}
.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:13px}.mini-group{display:flex;gap:8px}.mini{min-width:49px;height:49px;border:1px solid #dce7e4;background:#fff;border-radius:15px;color:#536b71;font-weight:850;display:flex;justify-content:center;align-items:center;gap:5px;padding:0 11px;font-size:11px;white-space:nowrap;box-shadow:0 2px 3px #142f2507}.mini svg{width:17px;height:17px;stroke-width:2}.mini:disabled{opacity:.4}.next{border:0;background:#d8e3e0;color:#75928f;border-radius:16px;min-height:50px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:950;font-size:14px;box-shadow:none;transition:all .2s var(--easing);white-space:nowrap}.next svg{width:18px;height:18px}.next.ready{background:#13bfae;color:#063c39;box-shadow:0 7px 0 #078e85,0 11px 21px #168e8440;transform:translateY(-3px)}.next.ready:active{transform:translateY(3px);box-shadow:0 1px 0 #078e85}
.footline{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 0;gap:12px;font-size:10px;font-weight:850;color:#a6b3b2}.footline .keys{display:flex;gap:12px}.keys span{display:flex;align-items:center;gap:5px;white-space:nowrap}.keys i{width:10px;height:10px;border-radius:4px;display:block}.keys i.amber{background:#f2b66f}.keys i.aqua{background:#3ad2bd}.footline .note{color:#95a7a6;white-space:nowrap;font-size:9px}
.overlay{position:fixed;inset:0;z-index:20;background:#09252fc2;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.modal{width:min(100%,440px);max-height:90dvh;overflow-y:auto;padding:23px;border-radius:25px;background:#fff;box-shadow:0 28px 80px #081d234d}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h3{font-size:22px;margin:0;font-weight:950;letter-spacing:-.04em}.modal .sub{font-size:12px;line-height:1.7;color:#72878b}.stage-field{display:flex;gap:9px;margin-top:18px}.stage-field input{min-width:0;flex:1;height:51px;padding:0 14px;border:1px solid #cfdedb;border-radius:13px;font-size:21px;font-weight:850;outline-color:#13bfae}.stage-field button{border:0;border-radius:13px;background:#12ad9d;color:white;padding:0 21px;font-weight:900}.chapters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.chapters button{background:#f3faf8;border:1px solid #dcece7;border-radius:14px;text-align:left;padding:13px 11px;font-size:11px;font-weight:900;color:#2b5d5d}.chapters button small{display:block;font-size:9px;font-weight:850;color:#8ea3a1;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,18px);padding:11px 15px;border-radius:14px;background:#163941;color:white;opacity:0;pointer-events:none;z-index:30;font-size:12px;font-weight:850;box-shadow:0 8px 22px #102e324a;max-width:calc(100vw - 30px);width:max-content;text-align:center;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:400px){.app{padding-left:12px;padding-right:12px}.heading{margin-top:17px}.heading h2{font-size:23px}.arena{height:clamp(325px,49svh,400px)}.supply{padding:11px 10px;gap:6px}.tray{gap:8px}.weight{width:53px;height:55px}.supply-title{width:58px}.supply-hint{width:45px;font-size:9px}.mini{padding:0 9px;min-width:42px}.mini .mini-txt{display:none}.next{padding:0 16px}}
@media(max-height:760px){.app{padding-top:calc(10px + env(safe-area-inset-top))}.heading{margin-top:12px;margin-bottom:10px}.heading h2{margin:4px 0 3px}.arena{height:clamp(290px,45svh,345px);min-height:290px}.supply{min-height:86px}.controls{margin-top:10px}.footline{margin-top:12px}}
@media(min-width:600px){.arena{height:435px}.app{padding-top:32px}.heading{margin-top:30px}.supply{padding:15px 23px}.weight{width:61px;height:62px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><div class="emblem" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none"><rect x="4" y="14" width="26" height="4.5" rx="2.25" fill="#d8fff7"/><path d="M17 19L11 28H23L17 19Z" fill="#5be1ce"/><circle cx="9" cy="11" r="5" fill="#ffbd77"/><circle cx="25" cy="11" r="3.3" fill="#65ead9"/></svg></div><div><h1>MOMENT</h1><span>THE BALANCE PUZZLE</span></div></div><div class="top-actions"><button class="tool" id="sound" aria-label="音声切り替え"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-lines" d="M15 8a5.5 5.5 0 0 1 0 8M18 5a9.5 9.5 0 0 1 0 14"/></svg></button><button class="tool" id="stages" aria-label="ステージ選択"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/></svg></button></div></header>
  <section class="heading"><div><div class="eyebrow" id="chapter">CHAPTER 01 · はじめてのてこ</div><h2 id="mission">水平に、ぴたり。</h2><p id="subtitle">おもりを置いて、バランスをとろう。</p></div><div class="stage-mark"><small>LEVEL</small><strong id="levelNum">001</strong><em> / 500</em></div></section>
  <div class="progress"><span id="progress"></span></div>
  <section class="game" id="game"><div class="arena"><canvas id="board" aria-label="てこ。おもりをドラッグするか、選んでから橋をタップして置く"></canvas><div class="live"><div class="prompt" id="prompt" role="status" aria-live="polite"><i class="dot"></i><span id="feedback">おもりを のせてみよう</span></div><div class="arena-label">BALANCE LAB</div></div><div class="success-banner" aria-hidden="true"><span class="sparkle">✓</span><strong>PERFECT!</strong><small>ぴたり、つりあった！</small></div><div class="tip-text" id="tipText">おもりを ドラッグ、または タップ</div></div><div class="supply"><div class="supply-title">きみの<strong>おもり</strong></div><div class="tray" id="tray"></div><div class="supply-hint">ここから<br>はこぼう</div></div></section>
  <nav class="controls" aria-label="ゲーム操作"><div class="mini-group"><button class="mini" id="prev" aria-label="前のステージ" title="前のステージ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><button class="mini" id="reset" title="やりなおす" aria-label="やりなおす"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/></svg><span class="mini-txt">やりなおし</span></button><button class="mini" id="hint" title="ヒント" aria-label="ヒント"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6m-5 3h4M9 14a6 6 0 1 1 6 0c-.8.7-1 1.6-1 2H10c0-.4-.3-1.3-1-2Z"/></svg><span class="mini-txt">ヒント</span></button></div><button id="next" class="next" aria-label="次のステージ">つぎへ <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button></nav>
  <footer class="footline"><div class="keys"><span><i class="amber"></i>動かせない</span><span><i class="aqua"></i>動かせる</span></div><div class="note">おもさ × きょり</div></footer>
</main>
<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h3>ステージをえらぶ</h3><button class="tool" id="close" aria-label="閉じる">×</button></div><p class="sub">1〜500まで、好きなステージを試せます。</p><div class="stage-field"><input id="jumpValue" inputmode="numeric" type="number" min="1" max="500" placeholder="1〜500"><button id="jump">ひらく</button></div><div class="chapters" id="chapters"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const MAX=500,MAX_DIST=5,C=document.getElementById('board'),ctx=C.getContext('2d'),game=document.getElementById('game'),feedback=document.getElementById('feedback'),prompt=document.getElementById('prompt'),tray=document.getElementById('tray'),tip=document.getElementById('tipText');
const chapters=[{from:1,to:35,name:'はじめてのてこ'},{from:36,to:90,name:'ふたつのおもり'},{from:91,to:160,name:'力をたしあわせる'},{from:161,to:230,name:'置けない場所'},{from:231,to:310,name:'みっつのおもり'},{from:311,to:400,name:'モーメントの達人'},{from:401,to:500,name:'マスターチャレンジ'}];
const handcrafted=[{f:[[-2,1]],m:[1],s:[2]},{f:[[3,1]],m:[1],s:[-3]},{f:[[-4,1]],m:[2],s:[2]},{f:[[-2,2]],m:[1],s:[4]},{f:[[2,3]],m:[2],s:[-3]},{f:[[-3,2]],m:[3],s:[2]},{f:[[4,1]],m:[2],s:[-2]},{f:[[-1,3]],m:[1],s:[3]},{f:[[-4,2]],m:[1,1],s:[3,5]},{f:[[4,2]],m:[1,1],s:[-3,-5]}];
let level=1,puzzle,solved=false,selected=null,drag=null,angle=0,velocity=0,canvasW=350,canvasH=380,last=0,soundOn=true,audio=null,confetti=[],winTime=0,stamp=null,hintUsed=false,timer=null,drawNeeded=true;
try{level=Math.min(500,Math.max(1,parseInt(localStorage.getItem('moment-level')||'1',10)||1));soundOn=localStorage.getItem('moment-sound')!=='off';}catch(e){}
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296;}}
function randint(R,min,max){return min+Math.floor(R()*(max-min+1));}
function shuffle(R,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=randint(R,0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function allowed(d){return Array.from({length:2*d},(_,i)=>i<d?-d+i:i-d+1);}
function spec(n){if(n<=12)return {m:1,f:1,d:4,b:0,cap:3};if(n<=35)return {m:n%5===0?2:1,f:1,d:5,b:0,cap:3};if(n<=90)return {m:2,f:1,d:5,b:0,cap:3};if(n<=160)return {m:2,f:2,d:5,b:0,cap:4};if(n<=230)return {m:2,f:2,d:5,b:1,cap:4};if(n<=310)return {m:3,f:2,d:5,b:1,cap:4};if(n<=400)return {m:3,f:3,d:5,b:2,cap:4};return {m:3,f:3,d:5,b:3,cap:4};}
function solutions(weights,slots,target,limit=100){const results=[],taken=new Set();let nodes=0;function go(i,sum,answer){if(results.length>=limit||nodes>15000)return;if(i===weights.length){if(sum===target)results.push(answer.slice());return;}for(const s of slots){if(taken.has(s))continue;nodes++;taken.add(s);answer.push(s);go(i+1,sum+s*weights[i],answer);answer.pop();taken.delete(s);if(nodes>15000)break;}}go(0,0,[]);return results;}
function generate(n){if(n<=10){let h=handcrafted[n-1];return {maxDist:5,fixed:h.f.map(([slot,mass],i)=>({id:'f'+i,slot,mass})),movable:h.m.map((mass,i)=>({id:'m'+i,slot:null,mass})),blocked:[],solution:h.s.slice()};}const sp=spec(n),R=rng(n*12771+20261106),slots=allowed(sp.d);let best=null,score=-Infinity;for(let k=0;k<210;k++){const arrangement=shuffle(R,slots),fixed=arrangement.slice(0,sp.f).map((slot,i)=>({id:'f'+i,slot,mass:randint(R,1,sp.cap)})),blocked=arrangement.slice(sp.f,sp.f+sp.b),free=slots.filter(s=>!fixed.some(f=>f.slot===s)&&!blocked.includes(s)),movable=Array.from({length:sp.m},(_,i)=>({id:'m'+i,slot:null,mass:randint(R,1,sp.cap)})),tor=fixed.reduce((v,f)=>v+f.slot*f.mass,0);if(!tor||Math.abs(tor)>sp.m*sp.d*sp.cap)continue;const sol=solutions(movable.map(m=>m.mass),free,-tor,100);if(!sol.length)continue;const rating=-Math.log(sol.length+1)*5+(Math.abs(tor)>1?1:0)+(fixed.some(f=>f.slot<0)&&fixed.some(f=>f.slot>0)?1:0)+R();if(rating>score){score=rating;best={maxDist:sp.d,fixed,movable,blocked,solution:sol[randint(R,0,sol.length-1)]};}if((sp.m===1&&sol.length<=1)||(sp.m===2&&sol.length<=3)||(sp.m===3&&sol.length<=10))break;}return best||{maxDist:5,fixed:[{id:'f0',slot:-2,mass:2}],movable:[{id:'m0',slot:null,mass:1}],blocked:[],solution:[4]};}
function chapter(n){return chapters.find(x=>n>=x.from&&n<=x.to)||chapters[0];}
function start(n){level=Math.min(MAX,Math.max(1,n));try{localStorage.setItem('moment-level',level);}catch(e){}puzzle=generate(level);solved=false;selected=null;drag=null;angle=0;velocity=0;confetti=[];winTime=0;hintUsed=false;const ch=chapter(level);document.getElementById('chapter').textContent='CHAPTER '+String(chapters.indexOf(ch)+1).padStart(2,'0')+' · '+ch.name;document.getElementById('mission').textContent=level<=3?'水平に、ぴたり。':level<=12?'ちょうどいい場所は？':level<=35?'距離でつりあわせよう':level<=160?'力をくみあわせよう':level<=310?'置き場所を見つけよう':'すべてを、つりあわせよう';document.getElementById('subtitle').textContent=level===1?'青いおもりを、右側に置いてみよう。':level===4?'軽くても、遠くに置くと……？':level<=10?'支点からの距離に注目しよう。':level<=35?'おもりを動かして、てこを水平に。':'すべてのおもりを使って、つりあわせよう。';document.getElementById('levelNum').textContent=String(level).padStart(3,'0');document.getElementById('progress').style.width=((level-1)/MAX*100)+'%';document.getElementById('prev').disabled=level===1;game.classList.remove('solved');tip.textContent=level===1?'青いおもりを 右のまるへ':level<=10?'ドラッグ、または タップで おいてみよう':'おもりは 何度でも 動かせるよ';setFeedback('おもりを のせてみよう');updateTray();updateNext();closeModal();drawNeeded=true;}
function setFeedback(t,balanced=false){feedback.textContent=t;prompt.classList.toggle('balanced',balanced);}
function updateTray(){tray.replaceChildren();for(const [i,p] of puzzle.movable.entries()){const btn=document.createElement('button');btn.className='weight'+(p.slot!==null?' used':'')+(selected===i?' selected':'');btn.disabled=solved||p.slot!==null;btn.type='button';btn.setAttribute('aria-label','重さ'+p.mass+'のおもり');btn.innerHTML='<span class="num">'+p.mass+'</span><span class="dots">'+Array.from({length:p.mass},()=>'<i></i>').join('')+'</span>';btn.addEventListener('pointerdown',e=>{if(solved||p.slot!==null)return;e.preventDefault();beginDrag(e,'tray',i,null);});tray.appendChild(btn);}}
function updateNext(){let b=document.getElementById('next');b.classList.toggle('ready',solved);b.setAttribute('aria-disabled',!solved);}
function torque(extra=0){let sum=extra;for(const p of puzzle.fixed)sum+=p.slot*p.mass;for(const p of puzzle.movable)if(p.slot!==null)sum+=p.slot*p.mass;return sum;}
function allPlaced(){return puzzle.movable.every(p=>p.slot!==null);}
function isFree(s,except=null){return Number.isInteger(s)&&s!==0&&Math.abs(s)<=puzzle.maxDist&&!puzzle.blocked.includes(s)&&!puzzle.fixed.some(p=>p.slot===s)&&!puzzle.movable.some((p,i)=>i!==except&&p.slot===s);}
function commit(i,s){if(solved||!isFree(s,i))return false;puzzle.movable[i].slot=s;selected=null;updateTray();hit('put');const t=torque();if(allPlaced()&&t===0){win();}else if(t>0){setFeedback('右が さがっている');}else if(t<0){setFeedback('左が さがっている');}else{setFeedback('いい感じ！ のこりを おこう');}drawNeeded=true;return true;}
function win(){solved=true;winTime=performance.now();velocity*=.2;game.classList.add('solved');setFeedback('つりあい せいこう！',true);tip.textContent='PERFECT BALANCE';updateTray();updateNext();hit('win');try{navigator.vibrate?.([18,40,32]);}catch(e){}const {cx,cy}=geometry();confetti=Array.from({length:46},(_,i)=>{const a=i*2.399+Math.random()*.5,s=1.7+Math.random()*3.4;return {x:cx,y:cy-28,dx:Math.cos(a)*s,dy:Math.sin(a)*s-1.6,life:1,r:2+Math.random()*3,col:i%3===0?'#ffca89':i%3===1?'#90f8e5':'#eafff2'};});}
function note(freq,dur=.14,gain=.11,delay=0,type='sine'){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.03);}catch(e){}}
function hit(type){if(type==='put'){note(410,.12,.14);note(615,.13,.08,.054);}else if(type==='pick'){note(350,.10,.08);}else if(type==='win'){note(523.25,.24,.17,0);note(659.25,.25,.15,.12);note(783.99,.25,.17,.24);note(1046.5,.56,.20,.39);note(523.25,.42,.075,.39);}else if(type==='bad'){note(285,.08,.05);}else{note(500,.08,.075);}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),2000);}
function resize(){const r=C.getBoundingClientRect(),dpr=Math.min(2.5,window.devicePixelRatio||1);canvasW=r.width;canvasH=r.height;C.width=Math.round(r.width*dpr);C.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawNeeded=true;}
function geometry(){const w=canvasW,h=canvasH,cx=w/2,cy=h*.62,gap=Math.min((w-48)/10.7,55);return {w,h,cx,cy,gap};}
function screenSlot(s,ang=angle){const {cx,cy,gap}=geometry();const dx=s*gap;return {x:cx+dx*Math.cos(ang),y:cy+dx*Math.sin(ang)};}
function closestSlot(x,y){const {cx,cy,gap}=geometry(),dx=x-cx,dy=y-cy,localX=dx*Math.cos(angle)+dy*Math.sin(angle),localY=-dx*Math.sin(angle)+dy*Math.cos(angle),s=Math.round(localX/gap);if(s===0||Math.abs(s)>puzzle.maxDist||Math.abs(localX-s*gap)>gap*.58||Math.abs(localY)>Math.max(65,gap*1.6))return null;return s;}
function local(e){const r=C.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function beginDrag(e,type,index,oldSlot){if(drag||solved)return;drag={id:e.pointerId,type,index,oldSlot,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:false};selected=index;try{document.body.setPointerCapture(e.pointerId);}catch(err){}updateTray();hit('pick');drawNeeded=true;}
C.addEventListener('pointerdown',e=>{if(solved)return;const p=local(e);let best=null,min=Infinity;for(let i=0;i<puzzle.movable.length;i++){const m=puzzle.movable[i];if(m.slot===null)continue;const wp=screenSlot(m.slot);const dist=Math.hypot(p.x-wp.x,p.y-(wp.y-35));if(dist<Math.max(31,geometry().gap*.72)&&dist<min){min=dist;best=i;}}if(best!==null){e.preventDefault();const old=puzzle.movable[best].slot;puzzle.movable[best].slot=null;beginDrag(e,'board',best,old);setFeedback('うごかす場所を えらぼう');drawNeeded=true;return;}if(selected!==null){const slot=closestSlot(p.x,p.y);if(slot!==null){e.preventDefault();if(!commit(selected,slot))hit('bad');}}});
window.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;if(Math.hypot(drag.x-drag.x0,drag.y-drag.y0)>8)drag.moved=true;drawNeeded=true;},{passive:true});
window.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;let p=local(e),slot=closestSlot(p.x,p.y);if(d.moved&&slot!==null&&commit(d.index,slot)){}else if(d.moved){if(d.oldSlot!==null){puzzle.movable[d.index].slot=d.oldSlot;selected=null;updateTray();}else{selected=d.index;updateTray();}setFeedback('まるの上に おいてみよう');}else if(d.type==='board'){selected=d.index;updateTray();setFeedback('新しい場所を タップしてね');}else{selected=d.index;updateTray();setFeedback('はしの まるを タップしてね');}drawNeeded=true;});
window.addEventListener('pointercancel',()=>{if(!drag)return;const d=drag;if(d.oldSlot!==null)puzzle.movable[d.index].slot=d.oldSlot;drag=null;selected=null;updateTray();drawNeeded=true;});
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function line(x,y,x2,y2,col,width=1){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function drawMass(x,y,mass,locked,scale=1,ghost=false){const size=(mass===1?37:mass===2?42:mass===3?47:51)*scale;ctx.save();ctx.translate(x,y);ctx.globalAlpha=ghost?.87:1;ctx.shadowColor=locked?'#faab605b':'#32dbc35b';ctx.shadowBlur=ghost?23:15;ctx.shadowOffsetY=6;const f=locked?'#ffbf76':'#76ead8',edge=locked?'#bf783b':'#159b8e';rr(-size/2,-size-5,size,size,Math.min(14,size*.29),edge);rr(-size/2+2,-size-8,size-4,size-6,Math.min(13,size*.27),f);ctx.shadowColor='transparent';rr(-size/2+8,-size-3,size-16,5,3,locked?'#ffe1ad':'#caffed');ctx.fillStyle=locked?'#7b471e':'#065f5d';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`950 ${Math.round(size*.46)}px ui-rounded,system-ui`;ctx.fillText(mass,0,-size*.55-3);for(let i=0;i<mass;i++)circle((i-(mass-1)/2)*6.5,-12,1.7,locked?'#aa6b36':'#0eaea0');ctx.restore();}
function drawScene(){const {w,h,cx,cy,gap}=geometry();ctx.clearRect(0,0,w,h);
 // Deep atmospheric field, with measured geometry rather than scenery.
 const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#102f3a');bg.addColorStop(.65,'#0b2630');bg.addColorStop(1,'#091e28');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 const halo=ctx.createRadialGradient(cx,cy-60,12,cx,cy-60,w*.69);halo.addColorStop(0,'#286c6b58');halo.addColorStop(.55,'#18575b2b');halo.addColorStop(1,'#12313a00');ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
 // Architectural dot field and subtle horizontal guide.
 for(let y=82;y<h-15;y+=30)for(let x=20;x<w-5;x+=30){circle(x,y,1,'#ffffff0c');}
 line(21,cy,w-21,cy,'#83d7cb20',1);ctx.setLineDash([3,7]);line(cx,83,cx,cy+95,'#85d5c526',1);ctx.setLineDash([]);
 // Elliptical radius marks give a physical sense of rotation.
 ctx.beginPath();ctx.arc(cx,cy,Math.min(102,gap*2.9),Math.PI*.10,Math.PI*.90);ctx.strokeStyle='#68bbb32b';ctx.lineWidth=1.7;ctx.stroke();
 // Fulcrum and its platform, placed behind beam.
 const pw=29,baseY=cy+70;ctx.beginPath();ctx.moveTo(cx,cy+9);ctx.lineTo(cx-29,baseY);ctx.lineTo(cx+29,baseY);ctx.closePath();const pGrad=ctx.createLinearGradient(cx-28,cy+10,cx+29,baseY);pGrad.addColorStop(0,'#81c2bd');pGrad.addColorStop(1,'#326b71');ctx.fillStyle=pGrad;ctx.fill();rr(cx-46,baseY,92,9,4.5,'#4e8e8e');rr(cx-36,baseY+9,72,3,1.5,'#1e5058');
 // Small but meaningful left/right direction labels.
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 10px ui-rounded,system-ui';ctx.letterSpacing='1.5px';ctx.fillStyle='#4c8289';ctx.fillText('LEFT',36,cy+108);ctx.fillText('RIGHT',w-35,cy+108);ctx.letterSpacing='0px';
 // Beam rotates, carrying all masses.
 ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
 const beamW=gap*10.7,beamY=-3;ctx.shadowColor='#07141f99';ctx.shadowBlur=18;ctx.shadowOffsetY=10;rr(-beamW/2,beamY,beamW,22,11,'#6d999c');ctx.shadowColor='transparent';let metal=ctx.createLinearGradient(0,beamY,0,beamY+22);metal.addColorStop(0,'#e5faf2');metal.addColorStop(.33,'#badfdc');metal.addColorStop(1,'#75a6aa');rr(-beamW/2+2,beamY-3,beamW-4,18,9,metal);rr(-beamW/2+7,beamY-1,beamW-14,3,2,'#ffffff9a');
 for(let s=-puzzle.maxDist;s<=puzzle.maxDist;s++){if(!s)continue;let x=s*gap;const locked=puzzle.blocked.includes(s),occupied=puzzle.fixed.some(p=>p.slot===s)||puzzle.movable.some(p=>p.slot===s);if(locked){rr(x-10,-18,20,14,4,'#47616b');line(x-5,-14,x+5,-6,'#91a7a9',2);line(x+5,-14,x-5,-6,'#91a7a9',2);}else if(!occupied){let hovering=false;if(drag){const r=C.getBoundingClientRect(),slot=closestSlot(drag.x-r.left,drag.y-r.top);hovering=slot===s&&isFree(s,drag.index);}const active=hovering||selected!==null&&isFree(s,selected);if(active){circle(x,-2,hovering?16:13,hovering?'#4effd647':'#52d7c425');circle(x,-2,7,hovering?'#99fff0':'#4cd5c3');}else{circle(x,-2,5,'#487c80');circle(x,-3,2.5,'#b6ded8');}}
 if(level>=21){ctx.font='800 10px ui-rounded,system-ui';ctx.fillStyle='#a1c6c3a3';ctx.fillText(String(Math.abs(s)),x,33);}
 }
 for(const p of puzzle.fixed)drawMass(p.slot*gap,-6,p.mass,true,w<400?.84:1);
 for(const p of puzzle.movable)if(p.slot!==null)drawMass(p.slot*gap,-6,p.mass,false,w<400?.84:1);
 ctx.restore();
 // Central pivot placed above beam; a luminous center pin.
 ctx.shadowColor='#7cf8dd7c';ctx.shadowBlur=12;circle(cx,cy+3,10,'#f0fff6');ctx.shadowBlur=0;circle(cx,cy+3,4.5,'#218b87');
 // Preview: mass follows the finger, while the beam reacts to its anticipated torque.
 if(drag){const r=C.getBoundingClientRect(),x=drag.x-r.left,y=drag.y-r.top,sl=closestSlot(x,y);drawMass(x,y+20,puzzle.movable[drag.index].mass,false,w<400?.93:1,true);if(sl!==null&&isFree(sl,drag.index)){const point=screenSlot(sl);ctx.beginPath();ctx.arc(point.x,point.y,17,0,Math.PI*2);ctx.strokeStyle='#a3fff4';ctx.lineWidth=2;ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);}}
 // A clean confirmation ring, no extraneous character animation.
 if(solved){const t=Math.max(0,(performance.now()-winTime)/1000);if(t<1.2){ctx.globalAlpha=Math.pow(1-t/1.2,1.1)*.55;ctx.beginPath();ctx.arc(cx,cy+3,17+t*88,0,Math.PI*2);ctx.lineWidth=2.8;ctx.strokeStyle='#8fffe7';ctx.stroke();ctx.globalAlpha=1;}}
 for(const p of confetti){if(p.life<=0)continue;ctx.globalAlpha=p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.x*.07);rr(-p.r/2,-p.r/2,p.r*1.5,p.r*.75,1,p.col);ctx.restore();}ctx.globalAlpha=1;
}
function frame(t){const dt=Math.min(2.2,(t-last)/16.666||1);last=t;let predicted=0;if(drag){const r=C.getBoundingClientRect(),s=closestSlot(drag.x-r.left,drag.y-r.top);if(s!==null&&isFree(s,drag.index))predicted=s*puzzle.movable[drag.index].mass;}const target=solved?0:Math.max(-.28,Math.min(.28,Math.tanh(torque(predicted)/10)*.25));velocity+=(target-angle)*.085*dt;velocity*=Math.pow(.79,dt);angle+=velocity*dt;if(Math.abs(target-angle)<.00008&&Math.abs(velocity)<.00008){angle=target;velocity=0;}if(confetti.length){for(const p of confetti){p.x+=p.dx*dt;p.y+=p.dy*dt;p.dy+=.095*dt;p.life-=.012*dt;}if(confetti.every(p=>p.life<=0))confetti=[];}if(drawNeeded||velocity||confetti.length||solved&&t-winTime<1700){drawScene();drawNeeded=false;}requestAnimationFrame(frame);}
function openModal(){document.getElementById('jumpValue').value=level;document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
const chaptersEl=document.getElementById('chapters');chapters.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML='<small>CHAPTER '+(i+1)+' · '+c.from+' — '+c.to+'</small>'+c.name;b.addEventListener('click',()=>{start(c.from);hit('tap');});chaptersEl.append(b);});
function jump(){const n=Number(document.getElementById('jumpValue').value);if(!Number.isInteger(n)||n<1||n>500)return toast('1〜500の数字を入れてね');start(n);hit('tap');}
document.getElementById('jump').addEventListener('click',jump);document.getElementById('jumpValue').addEventListener('keydown',e=>{if(e.key==='Enter')jump();});document.getElementById('stages').addEventListener('click',openModal);document.getElementById('close').addEventListener('click',closeModal);document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('moment-sound',soundOn?'on':'off');}catch(e){}document.querySelectorAll('.sound-lines').forEach(x=>x.style.display=soundOn?'':'none');toast(soundOn?'サウンド ON':'サウンド OFF');if(soundOn)hit('tap');});
document.getElementById('prev').addEventListener('click',()=>{if(level>1){start(level-1);hit('tap');}});document.getElementById('reset').addEventListener('click',()=>{start(level);hit('tap');});document.getElementById('hint').addEventListener('click',()=>{if(solved)return toast('もうつりあっているよ！');hintUsed=true;const hint=level<=2?'支点から、おなじだけ はなしてみよう':level<=4?'かるいおもりは、もっと遠くへ':level<=20?'おもさ × まんなかからの きょり':level<=90?'2つのおもりで、回す力を たそう':torque()<0?'左がわの 回す力が つよいよ':torque()>0?'右がわの 回す力が つよいよ':'すべてのおもりを おいてみよう';toast(hint);hit('tap');});
document.getElementById('next').addEventListener('click',()=>{if(!solved){toast('まずは ぴたりと つりあわせよう');hit('bad');return;}if(level<MAX){start(level+1);hit('tap');}else toast('500ステージ ぜんぶクリア！');});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='ArrowRight'&&solved)start(Math.min(MAX,level+1));if(e.key==='ArrowLeft'&&level>1)start(level-1);});window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=performance.now();});
if(!soundOn)document.querySelectorAll('.sound-lines').forEach(x=>x.style.display='none');start(level);resize();requestAnimationFrame(frame);
// Non-invasive read-only hooks used by automated integrity checks.
window.__momentQA={generate, get state(){return {level,solved,torque:torque(),puzzle:JSON.parse(JSON.stringify(puzzle))};}};
})();
