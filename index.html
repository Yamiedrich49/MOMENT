<script>
(()=>{'use strict';
// Nine authored puzzles: three controlled experiments, never randomized into unwinnable states.
// Torque uses signed hole indices times number of identical beads. Child bars weigh the sum of their beads.
const levels=[
 {mode:'slide',tag:'A · THE FIRST CLICK',title:'どこで、つりあう？',sub:'光る玉を横へ。穴を数えてみよう。',hint:'左は玉3こ、2つめの穴。右は玉2こ。',tip:'光るおもりを、横へすべらせよう ↔',top:[{id:'a',n:3,p:-2},{id:'b',n:2,p:1,opts:[1,2,3,4]}],answer:{b:3}},
 {mode:'slide',tag:'A · WEIGHT × DISTANCE',title:'重たいほうが、近くに。',sub:'光っている穴だけを使ってみよう。',hint:'左の4この玉が2つめの穴。右の2こは、どこ？',tip:'緑の穴にカチッと止まる',top:[{id:'a',n:4,p:-2},{id:'b',n:2,p:5,opts:[1,2,4,5]}],answer:{b:4}},
 {mode:'slide',tag:'A · TWO CHOICES',title:'どちらも動かしてみよう。',sub:'左の玉も、右の玉も。2か所で考える。',hint:'左の動く玉は2つめ、右の動く玉は5つめ。',tip:'2つのおもりを動かしてみよう',top:[{id:'a',n:2,p:-4},{id:'b',n:2,p:-5,opts:[-5,-2]},{id:'c',n:2,p:1},{id:'d',n:2,p:3,opts:[3,5]}],answer:{b:-2,d:5}},
 {mode:'share',tag:'B · A LITTLE TRADE',title:'玉をひとつ、わけてみる。',sub:'玉をつまんで、となりの束へ。',hint:'左右は同じ距離。玉の数も同じにすると…',tip:'玉を1こ、別の束へスーッと動かす',top:[{id:'a',n:1,p:-3},{id:'b',n:5,p:3}],answer:{a:3,b:3}},
 {mode:'share',tag:'B · INVERSE RATIO',title:'遠いほうには、少なく。',sub:'重さだけを変えて、水平にしよう。',hint:'左は支点から2つ、右は4つ。左にもっと玉を。',tip:'玉をつまんで、反対の束へ',top:[{id:'a',n:4,p:-2},{id:'b',n:5,p:4}],answer:{a:6,b:3}},
 {mode:'share',tag:'B · EIGHT BEADS',title:'8この玉を、どう分ける？',sub:'重さと距離、両方を見くらべよう。',hint:'左は3つ先、右は5つ先。左に5こ、右に3こ。',tip:'移動のたびに、棒の傾きを見よう',top:[{id:'a',n:2,p:-3},{id:'b',n:6,p:5}],answer:{a:5,b:3}},
 {mode:'cascade',tag:'C · ONE SMALL MOVE',title:'ひとつ動かすと、3本が。',sub:'左右の小さなてこを、いっしょに水平に。',hint:'左の小さなてこから、右のてこへ1こ動かす。',tip:'玉は、別のてこにも運べる',top:[{id:'L',type:'child',p:-2},{id:'R',type:'child',p:2}],children:{L:{max:2,weights:[{id:'la',n:3,p:-2},{id:'lb',n:2,p:2}]},R:{max:2,weights:[{id:'ra',n:1,p:-2},{id:'rb',n:2,p:2}]}},answer:{la:2,lb:2,ra:2,rb:2}},
 {mode:'cascade',tag:'C · TWO GOOD MOVES',title:'下を整えると、上も変わる。',sub:'別々のてこが、ひとつの仕組みに。',hint:'左の右側から左側へ、次は右の左側から左へ。',tip:'3本の棒が、いっしょに反応する',top:[{id:'L',type:'child',p:-2},{id:'R',type:'child',p:3}],children:{L:{max:2,weights:[{id:'la',n:2,p:-1},{id:'lb',n:3,p:2}]},R:{max:2,weights:[{id:'ra',n:3,p:-2},{id:'rb',n:2,p:2}]}},answer:{la:4,lb:2,ra:2,rb:2}},
 {mode:'cascade',tag:'C · THREE PERFECT RODS',title:'ぜんぶを、同時に。',sub:'玉の行き先を、何手か先まで考えよう。',hint:'ゴールの玉は左下が2と4、右下が3と6。',tip:'3本とも水平になればクリア',top:[{id:'L',type:'child',p:-3},{id:'R',type:'child',p:2}],children:{L:{max:2,weights:[{id:'la',n:3,p:-2},{id:'lb',n:1,p:1}]},R:{max:2,weights:[{id:'ra',n:5,p:-2},{id:'rb',n:6,p:1}]}},answer:{la:2,lb:4,ra:3,rb:6}}
];
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),field=$('field');
let stageIndex=0,puzzle=null,solved=false,hintShown=false,clickAt=0,soundOn=true,ac=null,noiseBuffer=null,selectedWeight=null,sourceId=null,drag=null,hoverTarget=null;
let W=350,H=410,dpr=1,lastFrame=0,bars={},hit=[],sparkles=[],wonAt=0,pulseAt=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
try{const n=parseInt(localStorage.getItem('moment.lab.stage')||'0',10);if(Number.isFinite(n))stageIndex=clamp(n,0,8);soundOn=localStorage.getItem('moment.lab.sound')!=='off'}catch(_){}
function allWeights(){return puzzle.mode==='cascade'?[...puzzle.children.L.weights,...puzzle.children.R.weights]:puzzle.top}
function findWeight(id){return allWeights().find(x=>x.id===id)}
function whichBar(w){if(puzzle.mode!=='cascade')return 'top';return puzzle.children.L.weights.includes(w)?'L':'R'}
function massOf(c){return c.type==='child'?puzzle.children[c.id].weights.reduce((s,w)=>s+w.n,0):c.n}
function torque(bar){let items=bar==='top'?puzzle.top:puzzle.children[bar]?.weights;return items?items.reduce((s,x)=>s+x.p*massOf(x),0):0}
function barBalanced(bar){return torque(bar)===0}
function allBalanced(){return barBalanced('top')&&(puzzle.mode!=='cascade'||barBalanced('L')&&barBalanced('R'))}
function resetStage(index){stageIndex=clamp(index,0,8);puzzle=JSON.parse(JSON.stringify(levels[stageIndex]));solved=false;hintShown=false;selectedWeight=puzzle.mode==='slide'?puzzle.top.find(w=>w.opts)?.id:null;sourceId=null;drag=null;hoverTarget=null;wonAt=0;sparkles=[];bars={};hit=[];
 $('tag').textContent=puzzle.tag;$('stagecount').textContent=String(stageIndex+1).padStart(2,'0')+' / 09';$('title').textContent=puzzle.title;$('subtitle').textContent=puzzle.sub;$('category').textContent=['DISTANCE','SHARING','CONNECTED'][Math.floor(stageIndex/3)];$('rule').textContent=puzzle.mode==='slide'?'DRAG TO A HOLE':puzzle.mode==='share'?'PASS ONE BEAD':'THREE BALANCES';
 field.classList.toggle('cascade',puzzle.mode==='cascade');$('tip').textContent=puzzle.tip;$('tip').classList.remove('hide');$('victory').classList.remove('on');$('feedback').classList.remove('good');$('feedback').textContent='';$('prev').disabled=stageIndex===0;$('next').disabled=true;$('next').classList.remove('ready');$('next').querySelector('span').textContent=stageIndex===8?'もう一度':'つぎへ';
 document.querySelectorAll('.chapter button').forEach((x,i)=>x.classList.toggle('on',Math.floor(stageIndex/3)===i));$('progress').innerHTML=levels.map((_,i)=>`<span class="${i===stageIndex?'current':i<stageIndex?'completed':''}"></span>`).join('');
 try{localStorage.setItem('moment.lab.stage',String(stageIndex))}catch(_){}resize();}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(3,window.devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);bars={};}
const geometry=(bar,p)=>({x:bar.x+bar.step*p*Math.cos(bar.angle),y:bar.y+bar.step*p*Math.sin(bar.angle)});
function buildGeometry(dt){const isC=puzzle.mode==='cascade';const topMax=isC?3:5;const step=Math.min(33.5,(W-40)/(2*topMax+1));const top=bars.top||(bars.top={x:W/2,y:0,step,angle:0,vel:0,max:topMax});top.x=W/2;top.y=isC?clamp(H*.225,83,131):clamp(H*.425,142,247);top.step=step;top.max=topMax;balanceDynamics(top,torque('top'),isC?16:22,dt);
 if(isC)for(const id of ['L','R']){const mount=puzzle.top.find(x=>x.id===id),anchor=geometry(top,mount.p),b=bars[id]||(bars[id]={x:0,y:0,angle:0,vel:0,max:2,step:19});b.x=anchor.x;b.y=anchor.y+clamp(H*.36,125,178);b.step=Math.min(19.5,Math.max(16.0,W*.050));b.max=2;balanceDynamics(b,torque(id),10,dt)} }
function balanceDynamics(b,t,scale,dt){const target=solved?0:clamp(t/scale*.34,-.22,.22),f=clamp((dt||16)/16.66,.3,2);b.vel+=(target-b.angle)*.083*f;b.vel*=Math.pow(.79,f);b.angle+=b.vel*f;if(Math.abs(target-b.angle)<.00005&&Math.abs(b.vel)<.00007){b.angle=target;b.vel=0}}
function line(a,b,d,e,color='#b0bdb4',w=1,dash=[]){g.beginPath();g.setLineDash(dash);g.moveTo(a,b);g.lineTo(d,e);g.strokeStyle=color;g.lineWidth=w;g.stroke();g.setLineDash([])}
function circle(x,y,r,fill,stroke,sw=1){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=sw;g.stroke()}}
function rounded(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function rope(x,y,toY){line(x,y+8,x,toY,'#c2c9b7',2.4);line(x-0.6,y+9,x-0.6,toY,'#ffffffaa',.7)}
function drawFixedSupport(){let t=bars.top;const h=puzzle.mode==='cascade'?62:94,topY=Math.max(30,t.y-h);line(t.x,topY,t.x,t.y-9,'#bdc7b7',2.6);circle(t.x,topY,5,'#e9b97a','#d1ad76',1);circle(t.x,topY,1.7,'#ffffe4')}
function positionOptions(w){if(!w.opts)return[];return w.opts.filter(p=>!puzzle.top.some(k=>k!==w&&k.p===p))}
function drawBeam(bar,id){const chosen=id==='top'&&puzzle.mode==='slide'?puzzle.top.find(w=>w.id===selectedWeight):null;
 // stationary level marker is the reference for horizontal, even when rod is tilted
 line(bar.x-bar.max*bar.step-10,bar.y,bar.x+bar.max*bar.step+10,bar.y,'#cce0d5',1,[3,5]);
 g.save();g.translate(bar.x,bar.y);g.rotate(bar.angle);
 const extent=bar.max*bar.step+12;g.save();g.shadowColor='#1b443b21';g.shadowBlur=11;g.shadowOffsetY=6;rounded(-extent,-8,extent*2,16,7,'#b99878');g.restore();
 const varnish=g.createLinearGradient(0,-8,0,8);varnish.addColorStop(0,'#e9d4b4');varnish.addColorStop(.47,'#dfc29e');varnish.addColorStop(.53,'#c8a987');varnish.addColorStop(1,'#b39676');rounded(-extent,-8,extent*2,16,7,varnish,'#b69774');line(-extent+7,-4,extent-7,-4,'#fff8e4ad',1.6);
 let opts=chosen?positionOptions(chosen):[];
 for(let p=-bar.max;p<=bar.max;p++){if(!p)continue;const x=p*bar.step;circle(x,0,5,'#a88969');circle(x,-.7,2.65,'#fff3de');if(opts.includes(p)&&!solved){circle(x,0,8.4,'#0ab4a415','#0fae9d87',1.4)}}
 if(chosen&&!solved){const end=chosen.p;const direction=Math.sign(end);for(let p=direction;p!==end+direction;p+=direction){circle(p*bar.step,0,3.45,'#0ba99f');circle(p*bar.step,-.35,1.75,'#eafff5')}circle(end*bar.step,0,11,'#0cab9919','#0da29a89',1.5)}
 g.restore();circle(bar.x,bar.y,8.7,'#fcfaf0','#b89c73',2);circle(bar.x,bar.y,4.0,'#e2b078');circle(bar.x-1.4,bar.y-1.5,1.15,'#fff3d4');
}
function beadOffsets(n){if(n===1)return[[0,0]];if(n===2)return[[-10,0],[10,0]];if(n===3)return[[-10,-9],[10,-9],[0,9]];if(n===4)return[[-10,-9],[10,-9],[-10,9],[10,9]];if(n===5)return[[-20,-9],[0,-9],[20,-9],[-10,9],[10,9]];if(n===6)return[[-20,-9],[0,-9],[20,-9],[-20,9],[0,9],[20,9]];const cols=n>=9?4:3;return Array.from({length:n},(_,i)=>[(i%cols-(cols-1)/2)*17.7,(Math.floor(i/cols)-Math.floor((Math.ceil(n/cols)-1)/2))*17.7])}
function drawBead(x,y,r=8.6,opacity=1){g.save();g.globalAlpha=opacity;g.shadowColor='#07786c3e';g.shadowBlur=6;g.shadowOffsetY=2;const grad=g.createRadialGradient(x-r*.36,y-r*.43,.8,x,y,r*1.35);grad.addColorStop(0,'#99f1e0');grad.addColorStop(.46,'#31c9bb');grad.addColorStop(1,'#008c8f');circle(x,y,r,grad);circle(x-r*.26,y-r*.31,r*.19,'#e4fff5aa');g.restore()}
function drawWeight(w,bar){const a=geometry(bar,w.p),isActive=puzzle.mode==='slide'&&selectedWeight===w.id&&!solved,isSelected=sourceId===w.id&&!solved,isHover=hoverTarget===w.id&&!solved;const stagger=puzzle.mode==='slide'&&stageIndex===2?(w.id==='b'||w.id==='d'?35:-14):0;const center={x:a.x,y:a.y+55+stagger};const n=w.n,off=beadOffsets(n).map(([x,y])=>puzzle.mode==='cascade'?[x*.78,y*.86]:[x,y]);
 rope(a.x,a.y,center.y-22);circle(a.x,a.y,6.8,'#fffdf2','#acc5b6',1.3);circle(a.x,a.y,2.8,'#d9b38e');
 if(isActive||isSelected||isHover){const p=(Math.sin(performance.now()*.004)+1)/2;circle(center.x,center.y,30+p*2.1,'#0bc5aa09',isHover?'#18b5aeb9':'#0fa69c5a',1.6)}
 off.forEach(([dx,dy])=>drawBead(center.x+dx,center.y+dy,puzzle.mode==='cascade'?7.4:8.5));
 if(isActive){circle(a.x,a.y,12,'#15b8a60d','#14b7a9b0',2.1);line(a.x-19,a.y-18,a.x-10,a.y-18,'#1da9a3',1.8);line(a.x+10,a.y-18,a.x+19,a.y-18,'#1da9a3',1.8)}
 hit.push({w,barId:whichBar(w),center,anchor:a,beads:off.map(([dx,dy])=>({x:center.x+dx,y:center.y+dy}))});
}
function drawChild(mount){const upper=bars.top,lower=bars[mount.id],a=geometry(upper,mount.p),ending=lower.y-8;rope(a.x,a.y,ending);circle(a.x,a.y,8.1,'#fffdf6','#acbeb1',1.7);circle(a.x,a.y,3.5,'#e0ae72');circle(a.x,ending,3,'#e0ae72')}
function render(now){g.clearRect(0,0,W,H);hit=[];drawFixedSupport();drawBeam(bars.top,'top');if(puzzle.mode==='cascade'){
 for(const m of puzzle.top)drawChild(m);
 for(const id of ['L','R']){drawBeam(bars[id],id);for(const w of puzzle.children[id].weights)drawWeight(w,bars[id])}
}else for(const w of puzzle.top)drawWeight(w,bars.top);
 if(drag?.moving&&puzzle.mode!=='slide'){let p=drag.current;g.save();g.shadowColor='#159d8b50';g.shadowBlur=17;circle(p.x,p.y-30,16,'#effffb','#17b4a7',2);g.restore();drawBead(p.x,p.y-30,10.7);}
 if(solved){const sec=(now-wonAt)/1000,glow=Math.min(1,sec*3);g.save();g.globalAlpha=.14*glow;const rg=g.createRadialGradient(W/2,bars.top.y,10,W/2,bars.top.y,Math.min(230,W*.68));rg.addColorStop(0,'#52dfad');rg.addColorStop(1,'#f2ffdf00');g.fillStyle=rg;g.fillRect(0,0,W,H);g.restore();for(const p of sparkles){let f=(sec-p.delay)/1.7;if(f<0||f>1)continue;g.save();g.globalAlpha=(1-f)*.8;circle(p.x+Math.sin(f*6+p.a)*12,p.y-f*78,p.r,p.color);g.restore()}}
}
function frame(now){const dt=Math.min(40,now-lastFrame||16);lastFrame=now;buildGeometry(dt);render(now);requestAnimationFrame(frame)}
function point(e){const b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
function nearestWeight(x,y,range=39){return hit.map(z=>({...z,d:Math.min(Math.hypot(x-z.center.x,y-z.center.y),Math.hypot(x-z.anchor.x,y-z.anchor.y)+9)})).filter(z=>z.d<range).sort((a,b)=>a.d-b.d)[0]||null}
function chosenSlideCandidate(x,y,w){const b=bars.top,dx=x-b.x,dy=y-b.y,dist=(dx*Math.cos(b.angle)+dy*Math.sin(b.angle))/b.step;const a=positionOptions(w);return a.length?a.reduce((p,q)=>Math.abs(q-dist)<Math.abs(p-dist)?q:p,a[0]):w.p}
function moveSlide(w,p){if(w.p===p||!positionOptions(w).includes(p))return;w.p=p;pulseAt=performance.now();clickSound('notch');$('feedback').textContent='';}
function transfer(source,target){if(solved||!source||!target||source===target)return false;if(source.n<=1){subtleSound();$('feedback').textContent='この束の最後の玉は、のこしてね';return false}if(target.n>=10){subtleSound();$('feedback').textContent='ここには、もう入らないみたい';return false}source.n--;target.n++;sourceId=null;hoverTarget=null;pulseAt=performance.now();clickSound('drop');$('tip').classList.add('hide');$('feedback').textContent='';finishCheck();return true}
function pickDrop(x,y,exclude){return nearestWeight(x,y,53)?.w?.id===exclude?null:nearestWeight(x,y,53)?.w||null}
c.addEventListener('pointerdown',e=>{if(solved)return;const p=point(e);let z=nearestWeight(p.x,p.y,puzzle.mode==='slide'?47:42);
 if(puzzle.mode==='slide'){
 if(!z){const b=bars.top;const sel=puzzle.top.find(w=>w.id===selectedWeight);if(sel&&Math.abs(p.y-b.y)<32){z={w:sel}}}
 if(!z||!z.w.opts)return;e.preventDefault();activateSound();selectedWeight=z.w.id;drag={kind:'slide',id:z.w.id,pid:e.pointerId,start:p};$('tip').classList.add('hide');c.setPointerCapture(e.pointerId);moveSlide(z.w,chosenSlideCandidate(p.x,p.y,z.w));
 }else{
 if(!z)return;e.preventDefault();activateSound();const w=z.w;const pendingSource=sourceId&&sourceId!==w.id?sourceId:null;sourceId=w.id;drag={kind:'bead',id:w.id,pid:e.pointerId,start:p,current:p,moving:false,pendingSource};$('tip').classList.add('hide');c.setPointerCapture(e.pointerId);clickSound('pickup');
 }});
c.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;e.preventDefault();const p=point(e);if(drag.kind==='slide'){let w=findWeight(drag.id);moveSlide(w,chosenSlideCandidate(p.x,p.y,w))}else{drag.current=p;if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>9)drag.moving=true;if(drag.moving){let t=pickDrop(p.x,p.y,drag.id);hoverTarget=t?t.id:null;}}});
function pointerEnd(e,canceled=false){if(!drag||drag.pid!==e.pointerId)return;const p=point(e),d=drag;drag=null;hoverTarget=null;if(d.kind==='slide'){clickSound('drop');finishCheck();return}
 const source=findWeight(d.id),target=!canceled&&d.moving?pickDrop(p.x,p.y,d.id):null;if(target)transfer(source,target);else if(!canceled&&!d.moving&&d.pendingSource)transfer(findWeight(d.pendingSource),source);else{sourceId=d.id;$('feedback').textContent='別の束をタップしても、玉を渡せるよ';}}
c.addEventListener('pointerup',e=>{if(!drag||drag.pid!==e.pointerId)return;e.preventDefault();pointerEnd(e)});c.addEventListener('pointercancel',e=>pointerEnd(e,true));
function finishCheck(){if(solved)return;if(allBalanced()){
 solved=true;wonAt=performance.now();sparkles=Array.from({length:20},(_,i)=>({x:18+Math.random()*(W-36),y:H*.52+Math.random()*H*.24,delay:Math.random()*.36,a:Math.random()*6.28,r:2+Math.random()*2.7,color:['#27c4ac','#e5bb7d','#92dac1'][i%3]}));$('victorylabel').textContent=puzzle.mode==='cascade'?'3本とも、ぴったり！':'ぴったり！';$('victory').classList.add('on');$('feedback').textContent='左右の力が、つりあった！';$('feedback').classList.add('good');$('tip').classList.add('hide');$('next').disabled=false;$('next').classList.add('ready');successSound();try{if(navigator.vibrate)navigator.vibrate([14,36,25])}catch(_){}
 }else if(puzzle.mode==='cascade'){const n=['top','L','R'].filter(barBalanced).length;$('feedback').textContent=n===2?'あと1本！ もう少し':n===1?'1本が水平になったよ':'どこを動かすと、何本変わる？';}
 else $('feedback').textContent='もう少し。玉と穴の距離を見てみよう';}
// Carefully filtered, quiet mechanical detents — no random melodic pitches while dragging.
function activateSound(){if(!soundOn)return null;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!noiseBuffer){noiseBuffer=ac.createBuffer(1,1024,ac.sampleRate);let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/180)}return ac}catch(_){return null}}
function smoothTone(f,t,dur,vol){if(!ac||!soundOn)return;const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(vol,t+.013);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v).connect(ac.destination);o.start(t);o.stop(t+dur+.01)}
function clickSound(kind='notch'){if(!soundOn)return;const a=activateSound();if(!a)return;const time=performance.now();if(kind==='notch'&&time-clickAt<42)return;clickAt=time;
 const t=a.currentTime,src=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();src.buffer=noiseBuffer;f.type='lowpass';f.frequency.setValueAtTime(kind==='drop'?900:kind==='pickup'?1100:1350,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(kind==='notch'?.027:.035,t+.003);v.gain.exponentialRampToValueAtTime(.0001,t+(kind==='notch'?.025:.060));src.connect(f).connect(v).connect(a.destination);src.start(t);src.stop(t+.07);smoothTone(kind==='notch'?390:kind==='pickup'?330:270,t,kind==='notch'?.042:.085,kind==='notch'?.018:.034);
}
function subtleSound(){if(activateSound())smoothTone(240,ac.currentTime,.10,.018)}
function successSound(){if(!activateSound())return;const now=ac.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>smoothTone(f,now+i*.115,i===3?.55:.27,i===3?.072:.053))}
function updateSoundIcon(){$('soundsvg').innerHTML=soundOn?'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>':'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6m0-6-5 6"/>';}
$('sound').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('moment.lab.sound',soundOn?'on':'off')}catch(_){}updateSoundIcon();if(soundOn)clickSound('pickup')});$('reset').addEventListener('click',()=>{clickSound('drop');resetStage(stageIndex)});$('prev').addEventListener('click',()=>{clickSound('drop');resetStage(stageIndex-1)});$('next').addEventListener('click',()=>{if(!solved)return;clickSound('drop');resetStage(stageIndex===8?0:stageIndex+1)});
$('hint').addEventListener('click',()=>{hintShown=!hintShown;$('subtitle').textContent=hintShown?puzzle.hint:puzzle.sub;clickSound('pickup')});document.querySelectorAll('.chapter button').forEach((b,i)=>b.addEventListener('click',()=>{if(Math.floor(stageIndex/3)===i)return;clickSound('drop');resetStage(i*3)}));

window.addEventListener('keydown',e=>{if(solved)return;if(puzzle.mode==='slide'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const w=findWeight(selectedWeight);if(!w)return;const opts=positionOptions(w).sort((a,b)=>a-b);const i=opts.indexOf(w.p);const j=clamp(i+(e.key==='ArrowLeft'?-1:1),0,opts.length-1);moveSlide(w,opts[j]);finishCheck()}});

// Integrity/test hooks: independent balances, positions, counts, and deterministic stage solutions.
window.__momentQA={levels:JSON.parse(JSON.stringify(levels)),get state(){return {stageIndex,mode:puzzle.mode,solved,torques:{top:torque('top'),...(puzzle.mode==='cascade'?{L:torque('L'),R:torque('R')}:{})},weights:allWeights().map(w=>({...w})),bars:JSON.parse(JSON.stringify(bars))}},go(i){resetStage(i)},setPos(id,p){const w=findWeight(id);if(!w||!w.opts||!w.opts.includes(p))return false;w.p=p;return true},setCounts(counts){for(const [id,n] of Object.entries(counts)){const w=findWeight(id);if(!w||!Number.isInteger(n)||n<1)return false;w.n=n}return true},transfer(a,b){return transfer(findWeight(a),findWeight(b))},check:finishCheck};
