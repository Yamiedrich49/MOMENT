  <section class="headline"><div class="titles"><div id="sect" class="section">01 / CHAIN REACTION</div><h1 id="headline">玉の行き先を変える</h1></div><div class="stage-nav"><button id="previous" class="navbtn" aria-label="前の問題">‹</button><span id="counter" class="stage-count">1 / 3</span><button id="following" class="navbtn" aria-label="次の問題">›</button></div></section>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('scene'),ctx=cv.getContext('2d'),PI=Math.PI,TAU=PI*2;
const P={A:[
 {title:'玉の行き先を変える',upper:[{id:'x',n:2,r:-2},{id:'y',n:3,r:1,opts:[1,2,3]}],lower:[{id:'l',n:1,r:-1}],target:1,topMax:4},
 {title:'小さく傾ける？ 大きく？',upper:[{id:'x',n:3,r:-3},{id:'y',n:2,r:4,opts:[2,4,5]}],lower:[{id:'l',n:1,r:3}],target:-3,topMax:5},
 {title:'右へ、少しだけ',upper:[{id:'x',n:2,r:-3},{id:'y',n:2,r:2,opts:[2,3,4,5]}],lower:[{id:'l',n:1,r:-3},{id:'m',n:1,r:2}],target:1,topMax:5}
 ],B:[
 {title:'5この玉を分けよう',beams:[{arm:[2,3],counts:[1,4]}]},
 {title:'2本とも、水平に',beams:[{arm:[1,2],counts:[2,4]},{arm:[2,3],counts:[4,1]}]},
 {title:'こちらを直すと、あちらが',beams:[{arm:[2,3],counts:[1,6]},{arm:[3,4],counts:[2,3]}]}
 ],C:[
 {title:'3つの腕のつりあい',arms:[{n:1,r:2},{n:2,r:1},{n:2,r:3,opts:[1,2,3]}]},
 {title:'2つの玉を動かす',arms:[{n:2,r:3},{n:3,r:3,opts:[1,2,3]},{n:1,r:4,opts:[2,3,4,5,6]}]},
 {title:'見えない中心を探す',arms:[{n:2,r:2,opts:[2,3,4,5,6]},{n:3,r:2,opts:[1,2,3,4,5,6]},{n:4,r:2,opts:[1,2,3,4,5,6]}]}
 ]};
const META={A:{section:'01 / CHAIN REACTION',field:'THE FALLING PEARL',symbol:'◆',help:'上の棒で玉の行き先が決まります。緑の玉を穴から穴へ動かして、下の棒が水平になるようにしてみよう。急な傾きでは、玉が遠くへ飛びます。'},B:{section:'02 / SHARED WEIGHTS',field:'ALL BEAMS',symbol:'● ●',help:'玉を別の束へドラッグすると、1こだけ移せます。使える玉の数は決まっています。すべての棒が水平になる配置を探そう。'},C:{section:'03 / THREE DIRECTIONS',field:'TOP VIEW',symbol:'✧',help:'真上から見た3本の腕。玉の束を腕に沿って動かします。3方向からの力がつり合うと、中心の小さな玉が真ん中に留まります。'}};
let mode='A',index=0,game=null,W=0,H=0,dpr=1,tick=0,drag=null,hot=[],active=null,soundOn=true,audio=null,noise=null,attempt=0;const progress={A:0,B:0,C:0};
try{const saved=JSON.parse(localStorage.getItem('moment_lab_v1')||'{}');for(let k of 'ABC')if(Number.isInteger(saved[k]))progress[k]=Math.min(3,Math.max(0,saved[k]));}catch(e){}
const copy=x=>JSON.parse(JSON.stringify(x)),clamp=(x,a,b)=>Math.max(a,Math.min(x,b));
const vecs=[{x:0,y:-1},{x:Math.sqrt(3)/2,y:.5},{x:-Math.sqrt(3)/2,y:.5}];
function board(){game={...copy(P[mode][index]),phase:'edit',start:0,success:false,chosen:null,candidate:null};drag=null;attempt=0;active=null;hot=[];
 if(mode==='A')game.chosen=game.upper.find(w=>w.opts).id;
 if(mode==='C')game.chosen='a'+(game.arms.findIndex(a=>a.opts));
 $('headline').textContent=game.title;$('sect').textContent=META[mode].section;$('fieldTitle').textContent=META[mode].field;$('fieldIcon').textContent=META[mode].symbol;$('counter').textContent=`${index+1} / 3`;
 $('previous').disabled=index===0;$('following').disabled=index===2;$('feedback').textContent='';$('feedback').className='field-bottom';$('success').classList.remove('on');
 document.querySelectorAll('.mode').forEach(e=>e.classList.toggle('on',e.dataset.mode===mode));$('dots').innerHTML=P[mode].map((_,i)=>`<span class="stage-dot ${i===index?'on':i<progress[mode]?'passed':''}"></span>`).join('');updateButton();}
function updateButton(){const b=$('check'),s=b.querySelector('span');b.disabled=game.phase==='running';b.classList.toggle('complete',game.success);s.textContent=game.success?'次の問題':game.phase==='result'?'位置を直す':'ためす';b.querySelector('svg').innerHTML=game.success?'<path d="M4 12h16m-7-7 7 7-7 7"/>':game.phase==='result'?'<path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/>':'<path d="m8 5 10 7-10 7V5Z"/>';}
function changeMode(m){if(mode===m)return;mode=m;index=0;play('mode');board();}function moveIndex(d){let j=clamp(index+d,0,2);if(j===index)return;index=j;play('mode');board();}
function storeWin(){progress[mode]=Math.max(progress[mode],index+1);try{localStorage.setItem('moment_lab_v1',JSON.stringify(progress))}catch(e){}}
function prepareEdit(){if(game.phase==='edit')return;game.phase='edit';game.start=0;game.success=false;$('success').classList.remove('on');$('feedback').className='field-bottom';$('feedback').textContent='';updateButton();}
function thetaA(){return game.upper.reduce((s,w)=>s+w.n*w.r,0)}
function landing(){const t=thetaA();if(t===0)return 0;return Math.sign(t)*(Math.abs(t)>=4?3:1)}
function torqueLower(){const dest=landing();return game.lower.reduce((s,w)=>s+w.n*w.r,0)+dest}
function momentsB(){return game.beams.map(b=>-b.arm[0]*b.counts[0]+b.arm[1]*b.counts[1])}
function vectorC(){let x=0,y=0;game.arms.forEach((a,i)=>{x+=vecs[i].x*a.n*a.r;y+=vecs[i].y*a.n*a.r});return {x,y,mag:Math.hypot(x,y)}}
function verdict(){if(mode==='A')return landing()!==0 && torqueLower()===0;if(mode==='B')return momentsB().every(t=>t===0);return vectorC().mag<.00001}
function go(){if(game.success){if(index<2)moveIndex(1);else if(mode!=='C')changeMode(mode==='A'?'B':'C');else{index=0;board();}return}
 if(game.phase==='result'){prepareEdit();play('unlock');return}
 if(game.phase!=='edit')return;game.phase='running';game.start=performance.now();attempt++;$('feedback').textContent='';play('release');updateButton();}
const len=()=>Math.min(W,H),now=()=>performance.now();
function reset(){play('mode');board()}
function sound(){if(!soundOn)return null;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function tone(f,d=.055,v=.05,kind='sine',delay=0){const a=sound();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter();o.type=kind;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(80,f*.8),t+d);fl.type='lowpass';fl.frequency.value=2200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
let lastClick=0;function play(kind){if(kind==='notch'){const t=now();if(t-lastClick<48)return;lastClick=t;tone(540,.027,.021,'triangle');return}if(kind==='pickup'){tone(410,.046,.025,'sine');return}if(kind==='drop'){tone(370,.070,.035,'sine');return}if(kind==='mode'){tone(490,.042,.02,'sine');return}if(kind==='release'){tone(260,.110,.04,'sine');tone(390,.065,.016,'sine',.06);return}if(kind==='unlock'){tone(350,.055,.028);return}if(kind==='fail'){tone(300,.11,.024,'sine');return}if(kind==='success'){tone(440,.19,.036,'sine',0);tone(550,.20,.035,'sine',.10);tone(660,.27,.032,'sine',.21)}}
function fit(){const rect=cv.getBoundingClientRect();W=rect.width;H=rect.height;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(fit).observe(cv);
const cx=()=>W/2;
function line(x,y,x2,y2,color='#9baca0',width=1,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function path(points,color,width=2){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore()}
function circle(x,y,r,color,stroke=null,sw=1){ctx.beginPath();ctx.arc(x,y,Math.max(.001,r),0,TAU);if(color){ctx.fillStyle=color;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}}
function rounded(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function txt(t,x,y,size=11,color='#688b83',weight=700,align='center'){ctx.save();ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()}
function shadow(x,y,r,a=.1){ctx.save();ctx.filter=`blur(${Math.max(3,r/4)}px)`;circle(x,y+5,r,`rgba(46,76,49,${a})`);ctx.restore()}
function bead(x,y,r=8,movable=true,scale=1){r*=scale;shadow(x,y,r,.10);const grad=ctx.createRadialGradient(x-r*.38,y-r*.48,1,x,y,r*1.3);if(movable){grad.addColorStop(0,'#b3f7e4');grad.addColorStop(.43,'#35cbb0');grad.addColorStop(1,'#079787')}else{grad.addColorStop(0,'#e7e5d9');grad.addColorStop(.5,'#b7b8a7');grad.addColorStop(1,'#919b8b')}circle(x,y,r,grad, movable?'#0c8e7a':'#9fa99b',.8);circle(x-r*.30,y-r*.3,r*.21,'#ffffff8c')}
const beadOffsets=n=>{let cols=n<=2?n:n<=4?2:3,rows=Math.ceil(n/cols),dx=n>6?15.7:17.8,dy=n>6?15:16.5;return Array.from({length:n},(_,i)=>({x:((i%cols)-(Math.min(cols,n)-1)/2)*dx,y:(Math.floor(i/cols)-(rows-1)/2)*dy}))};
function cluster(x,y,n,movable=true,selected=false,small=false){const pts=beadOffsets(n),s=small?.84:1;
 if(selected){circle(x,y,Math.max(19,n>4?26:21), '#10bc9a12','#1fae9670',1.5)}
 for(const p of pts)bead(x+p.x*s,y+p.y*s,small?7:8.35,movable,1);
