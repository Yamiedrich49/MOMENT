<script>
(()=>{'use strict';
const levels=[

 {tag:'A LITTLE DISCOVERY',title:'軽くても、遠くなら。',sub:'玉の数と、穴の遠さを見くらべよう。',hint:'左は玉1こで4つめの穴。右は2こだよ。',top:[{id:'a',type:'weight',n:1,p:-4},{id:'b',type:'weight',n:2,p:4,m:true}],tip:'玉をつかんで、近づけてみよう'},
 {tag:'TWO FORCES',title:'ふたつの力を、あわせる。',sub:'右の玉たちで、左とつりあわせよう。',hint:'右には動かない玉が2こ。残りの玉の位置を考えよう。',top:[{id:'a',type:'weight',n:2,p:-4},{id:'c',type:'weight',n:2,p:1},{id:'b',type:'weight',n:2,p:5,m:true}],tip:'2つの右のおもりは、力を足しあわせる'},
 {tag:'A MOBILE WITHIN',title:'てこの下に、もうひとつ。',sub:'下のてこを、まるごと左右へ動かそう。',hint:'下のてこ全体の玉は2こ。左の玉は2こで、3つめの穴。',top:[{id:'a',type:'weight',n:2,p:-3},{id:'child',type:'child',p:1,m:true}],lower:[{id:'d',type:'weight',n:1,p:-2},{id:'e',type:'weight',n:1,p:2}],tip:'上の光る輪っかから、下のてこを動かそう'},
 {tag:'THE DOUBLE BALANCE',title:'上も、下も、ぴったり。',sub:'2本のてこを、どちらも水平にしよう。',hint:'まず上のてこ。次に下の玉を動かしてみて。',top:[{id:'a',type:'weight',n:4,p:-3},{id:'child',type:'child',p:2,m:true}],lower:[{id:'d',type:'weight',n:1,p:-2},{id:'e',type:'weight',n:2,p:3,m:true}],tip:'光る輪っかと玉の、両方をうごかそう'}
];
const $=id=>document.getElementById(id);const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:true});let W=350,H=380,DPR=1,step=27,childStep=21,bar0=null,bar1=null,beams=[];let level=0,puzzle=null,solved=false,drag=null,selected='b',hintOn=false,tutorialHidden=false,winAt=0,celebration=[],flash=0,animPrev=performance.now(),soundOn=true,audio=null,clickAt=0,dragPoint=null;
try{level=Math.min(4,Math.max(0,Number(localStorage.getItem('moment.mobile.level')||0)||0));soundOn=localStorage.getItem('moment.mobile.sound')!=='off'}catch(_){}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const lerp=(a,b,f)=>a+(b-a)*f;
const roundRect=(x,y,w,h,r,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}};
const weight=(arr,id)=>{const v=arr.find(o=>o.id===id);return v?v.n:0};
function total(node){return node.type==='child'?puzzle.lower.reduce((s,b)=>s+b.n,0):node.n}
function torque(which){return puzzle[which].reduce((sum,o)=>sum+o.p*total(o),0)}
function eligible(o,rod){const arr=puzzle[rod];const max=rod==='top'?5:3;let from=1,to=max;if(o.id==='child'&&level===4)to=4;const side=o.p<0?-1:1;let opts=[];for(let i=from;i<=to;i++){let p=i*side;if(!arr.some(x=>x!==o&&x.p===p))opts.push(p)}return opts}
function movedCandidate(o,rod,x,y){const geom=rod==='top'?bar0:bar1;if(!geom)return o.p;const dx=x-geom.x,dy=y-geom.y;const dist=dx*Math.cos(geom.angle)+dy*Math.sin(geom.angle);const target=dist/geom.step;let choices=eligible(o,rod);return choices.length?choices.reduce((v,c)=>Math.abs(c-target)<Math.abs(v-target)?c:v,choices[0]):o.p}
function maybeSound(){if(!soundOn)return null;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(_){return null}}
function tone(freq,when,duration=.16,vol=.11,kind='sine'){const a=maybeSound();if(!a)return;const osc=a.createOscillator(),env=a.createGain(),low=a.createBiquadFilter();osc.type=kind;osc.frequency.setValueAtTime(freq,when);low.type='lowpass';low.frequency.value=1700;env.gain.setValueAtTime(0.0001,when);env.gain.exponentialRampToValueAtTime(vol,when+.018);env.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(low);low.connect(env);env.connect(a.destination);osc.start(when);osc.stop(when+duration+.01)}
function tick(){const a=maybeSound();if(!a)return;const t=a.currentTime;tone(440,t,.095,.045,'sine');tone(659.25,t+.036,.11,.034,'sine')}
function winSound(){const a=maybeSound();if(!a)return;const t=a.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.35]].forEach(([f,d],i)=>tone(f,t+d,i===3?.48:.30,i===3?.11:.090,'sine'))}
function initLevel(i){level=clamp(i,0,4);puzzle=JSON.parse(JSON.stringify(levels[level]));solved=false;drag=null;hintOn=false;winAt=0;celebration=[];selected=puzzle.top.find(x=>x.m)?.id||'b';tutorialHidden=false;flash=0;beams=[];bar0={x:0,y:0,angle:0,v:0,step:0};bar1={x:0,y:0,angle:0,v:0,step:0};$('eyebrow').textContent=puzzle.tag;$('story').textContent=puzzle.title;$('subtitle').textContent=puzzle.sub;$('depthLabel').textContent=puzzle.lower?'DOUBLE MOBILE':'SINGLE MOBILE';$('field').classList.toggle('two-tier',!!puzzle.lower);$('stageNumber').textContent=`0${level+1} / 05`;$('success').classList.remove('on');$('tutorial').textContent=puzzle.tip;$('tutorial').classList.remove('hide');$('balanceLabel').textContent='ゆっくり動かして、水平にしよう';$('balanceLabel').classList.remove('good');$('prevBtn').disabled=level===0;$('nextBtn').disabled=true;$('nextBtn').classList.remove('ready');$('nextBtn').querySelector('span').textContent=level===4?'ゴールへ':'つぎへ';$('progress').innerHTML=levels.map((_,j)=>`<span class="${j<level?'done':j===level?'active':''}"></span>`).join('');try{localStorage.setItem('moment.mobile.level',String(level))}catch(_){}resize()}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;DPR=Math.min(3,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(W*DPR));canvas.height=Math.max(1,Math.floor(H*DPR));ctx.setTransform(DPR,0,0,DPR,0,0);step=Math.min(34,(W-68)/12);childStep=Math.min(25,step*.78);}
const pos=(g,p)=>({x:g.x+p*g.step*Math.cos(g.angle),y:g.y+p*g.step*Math.sin(g.angle)});
function updateGeometry(dt){const two=!!puzzle.lower;const yTop=two?Math.max(87,H*.245):H*.43;bar0.x=W/2;bar0.y=yTop;bar0.step=step;
 const t0=torque('top');const goal0=solved?0:clamp(t0/(two?18:19)*.30,-.245,.245);updateBeam(bar0,goal0,dt);
 if(two){const ch=puzzle.top.find(o=>o.type==='child');const pt=pos(bar0,ch.p);bar1.x=pt.x;bar1.y=pt.y+clamp(H*.33,106,164);bar1.step=childStep;const t1=torque('lower');const goal1=solved?0:clamp(t1/8*.33,-.23,.23);updateBeam(bar1,goal1,dt)}
}
function updateBeam(b,target,dt){const f=clamp(dt/16.66,.4,2.2);b.v+=(target-b.angle)*.075*f;b.v*=Math.pow(.80,f);b.angle+=b.v*f;if(Math.abs(b.angle-target)<.00008&&Math.abs(b.v)<.00008){b.angle=target;b.v=0}}
function line(x1,y1,x2,y2,color,width=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();ctx.setLineDash([])}
function circle(x,y,r,fill,stroke,width=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function drawString(fromX,fromY,toY){line(fromX,fromY,fromX,toY,'#aabeb3',2);line(fromX-.45,fromY+2,fromX-.45,toY,'#fcfffe',.55)}
function drawBead(x,y,r=9.5){ctx.save();ctx.shadowColor='#08777738';ctx.shadowBlur=6;ctx.shadowOffsetY=3;const g=ctx.createRadialGradient(x-r*.35,y-r*.45,1,x,y,r*1.3);g.addColorStop(0,'#7ee9df');g.addColorStop(.55,'#22bdb7');g.addColorStop(1,'#078f94');circle(x,y,r,g);ctx.restore();circle(x-r*.27,y-r*.38,r*.23,'#c0fff8b0')}
function beadLocs(n){let a=[];if(n===1)a=[[0,0]];if(n===2)a=[[-10,0],[10,0]];if(n===3)a=[[-10,-8],[10,-8],[0,10]];if(n===4)a=[[-10,-10],[10,-10],[-10,10],[10,10]];return a}
function drawMass(o,rod){const b=rod==='top'?bar0:bar1;const pt=pos(b,o.p);const h=38;const centerY=pt.y+h+12;drawString(pt.x,pt.y+8,centerY-10);circle(pt.x,pt.y+10,3,'#b4c1b7');const isActive=o.m&&selected===o.id&&!solved;
 if(isActive){const pulse=.5+.5*Math.sin(performance.now()*.0032);circle(pt.x,centerY,32+pulse*3,'#19b5ac0e','#21c5b54c',1.5);circle(pt.x,pt.y,14+pulse*1.5,null,'#23b2a790',2)}
 const massN=beadLocs(o.n);massN.forEach(([dx,dy])=>drawBead(pt.x+dx,centerY+dy,9.3));
 // small attachment hook with tactile metallic ring
 circle(pt.x,pt.y,7.7,'#fcfffa','#a5bab2',1.7);circle(pt.x,pt.y,3.25,isActive?'#12ada9':'#b8c9c0');
 return {obj:o,rod,anchor:pt,center:{x:pt.x,y:centerY},radius:35};
}
function drawChild(o){const pt=pos(bar0,o.p);const endY=bar1.y-10;drawString(pt.x,pt.y+8,endY);const active=o.m&&selected===o.id&&!solved;const pulse=.5+.5*Math.sin(performance.now()*.0034);
 if(active){ctx.save();ctx.shadowColor='#10baaf60';ctx.shadowBlur=12;circle(pt.x,pt.y,15+pulse*2,'#ffffffc9','#16b5ae',2.7);ctx.restore();drawArrows(pt.x,pt.y-23)}
 circle(pt.x,pt.y,9.5,'#ffffff','#a4b9b1',1.5);circle(pt.x,pt.y,4,active?'#12b5aa':'#d3b387');circle(pt.x,endY,4,'#deb281');

}
function drawArrows(x,y){ctx.save();ctx.strokeStyle='#17a5a1';ctx.lineWidth=1.8;ctx.lineCap='round';line(x-21,y,x-12,y,'#22ada7',1.8);line(x+12,y,x+21,y,'#22ada7',1.8);line(x-21,y,x-17,y-4,'#22ada7',1.8);line(x-21,y,x-17,y+4,'#22ada7',1.8);line(x+21,y,x+17,y-4,'#22ada7',1.8);line(x+21,y,x+17,y+4,'#22ada7',1.8);ctx.restore()}
function drawRod(b,rod,max=5){const activeObj=puzzle[rod].find(o=>o.id===selected);const axis=b.angle;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(axis);
 // horizontal ghost line reference, subtle to make level immediately legible
 line(-max*b.step-17,0,max*b.step+17,0,'#ffffffd0',11);
 ctx.save();ctx.shadowBlur=13;ctx.shadowOffsetY=7;ctx.shadowColor='#31504a20';roundRect(-max*b.step-12,-8,2*(max*b.step+12),16,8,'#bd9873');ctx.restore();
 const body=ctx.createLinearGradient(0,-8,0,9);body.addColorStop(0,'#e8cfae');body.addColorStop(.48,'#d4b78b');body.addColorStop(.52,'#caab7d');body.addColorStop(1,'#b18e68');roundRect(-max*b.step-11,-8,2*(max*b.step+11),16,8,body,'#af946e');line(-max*b.step-4,-4,max*b.step+4,-4,'#fff7e7ab',2);
 // step-indexed holes, deliberately consistent for intuitive visual measurement
 for(let i=-max;i<=max;i++){if(i===0)continue;const x=i*b.step;circle(x,0,4.9,'#967d5b');circle(x,-.7,2.8,'#fff8ec');}
 if(activeObj){const x=activeObj.p*b.step; const sign=Math.sign(activeObj.p);for(let i=1;i<=Math.abs(activeObj.p);i++){const xx=sign*i*b.step;circle(xx,0,4.7,'#0faaa9');circle(xx,-.5,2.5,'#d9fffa')}
  if(!solved){const p=.5+.5*Math.sin(performance.now()*.0034);circle(x,0,11+p*1.5,'#0faeab18','#0caea880',1.5)}
 }
 ctx.restore();
 // pin + suspended upper rope
 circle(b.x,b.y,9,'#fffaf0','#bc986f',2);circle(b.x,b.y,4.2,'#e0a466');circle(b.x-1.2,b.y-1.6,1.4,'#fff2d3');
}
function drawSupport(){if(!puzzle.lower){const ceilingY=Math.max(29,bar0.y-95);line(bar0.x,ceilingY,bar0.x,bar0.y-11,'#b0c1b8',2.5);circle(bar0.x,ceilingY,6,'#e3b574');circle(bar0.x,ceilingY,2.4,'#fff5db');}else{const ceilingY=Math.max(28,bar0.y-68);line(bar0.x,ceilingY,bar0.x,bar0.y-10,'#b0c1b8',2.5);circle(bar0.x,ceilingY,5.5,'#e3b574');circle(bar0.x,ceilingY,2.4,'#fff5db');}}
function drawRuler(b,max){if(!b)return;ctx.save();ctx.globalAlpha=.52;const by=b.y-28;line(b.x-max*b.step,by,b.x+max*b.step,by,'#d2ded5',1,[2,5]);for(let i=-max;i<=max;i++){const x=b.x+i*b.step;line(x,by-3,x,by+3,'#9db8ad',.8)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const two=!!puzzle.lower;
 // distant horizontal visual reference; no arithmetic labels
 ctx.save();ctx.globalAlpha=.65;line(18,bar0.y,W-18,bar0.y,'#d7e7dc',1,[4,6]);ctx.restore();
 drawRuler(bar0,5);drawSupport();drawRod(bar0,'top',5);beams=[];
 for(const o of puzzle.top){if(o.type==='weight')beams.push(drawMass(o,'top'));}
 if(two){beams.push(drawChild(puzzle.top.find(o=>o.type==='child')));drawRuler(bar1,3);drawRod(bar1,'lower',3);for(const o of puzzle.lower)beams.push(drawMass(o,'lower'))}
 if(solved){const d=(performance.now()-winAt)/1000;ctx.save();ctx.globalAlpha=Math.min(.8,Math.max(0,1-d/2))*.28;const gr=ctx.createRadialGradient(W/2,bar0.y,12,W/2,bar0.y,Math.min(W*.55,200));gr.addColorStop(0,'#85e7c5');gr.addColorStop(1,'#e4f9dd00');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.restore();celebration.forEach(p=>{const elapsed=d-p.delay;if(elapsed<0)return;const life=1.65;const t=elapsed/life;if(t>1)return;ctx.save();ctx.globalAlpha=(1-t)*.9;circle(p.x+Math.sin(t*8+p.a)*14,p.y-t*70,p.r,p.c);ctx.restore()})}
}
function drawLoop(now){const dt=Math.min(45,now-animPrev||16);animPrev=now;updateGeometry(dt);draw();requestAnimationFrame(drawLoop)}
function pick(x,y){const two=!!puzzle.lower;const cand=beams.filter(v=>v.obj.m).map(v=>{let dist=Math.hypot(x-v.anchor.x,y-v.anchor.y);if(v.obj.type==='weight')dist=Math.min(dist,Math.hypot(x-v.center.x,y-v.center.y)-5);else if(level===3){dist=Math.min(dist,Math.abs(y-bar1.y)+Math.max(0,Math.abs(x-bar1.x)-65))}else {const midY=(v.anchor.y+bar1.y)/2;if(Math.abs(x-v.anchor.x)<23&&y>v.anchor.y&&y<bar1.y)dist=Math.min(dist,Math.abs(x-v.anchor.x)+4)}return {...v,dist}}).sort((a,b)=>a.dist-b.dist);return cand.length&&cand[0].dist<39?cand[0]:null}
function moved(o,rod,p){if(!o||!o.m||solved||o.p===p)return false;const opts=eligible(o,rod);if(!opts.includes(p))return false;o.p=p;flash=performance.now();if(performance.now()-clickAt>58){tick();clickAt=performance.now()}$('balanceLabel').textContent='';return true}
function alignTo(x,y,item){const p=movedCandidate(item.obj,item.rod,x,y);moved(item.obj,item.rod,p)}
function findScene(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function getSelected(){let all=[...puzzle.top,...(puzzle.lower||[])];const o=all.find(o=>o.id===selected);if(!o)return null;return {obj:o,rod:puzzle.top.includes(o)?'top':'lower'}}
canvas.addEventListener('pointerdown',e=>{if(solved)return;const xy=findScene(e);let hit=pick(xy.x,xy.y);if(!hit){const sel=getSelected();const g=sel?.rod==='top'?bar0:bar1;const d=g?Math.abs(xy.y-g.y):999;if(sel&&d<30&&xy.x>25&&xy.x<W-25){hit={obj:sel.obj,rod:sel.rod,anchor:{x:xy.x,y:xy.y},dist:0}}}
 if(!hit){if(puzzle.lower){const g=bar1;if(Math.abs(xy.y-g.y)<30){const next=puzzle.lower.find(o=>o.m);if(next){hit={obj:next,rod:'lower'}}}}
 }if(!hit)return;
 e.preventDefault();maybeSound();selected=hit.obj.id;drag={id:hit.obj.id,rod:hit.rod,pid:e.pointerId};tutorialHidden=true;$('tutorial').classList.add('hide');canvas.setPointerCapture(e.pointerId);alignTo(xy.x,xy.y,hit)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;e.preventDefault();const xy=findScene(e);let obj=puzzle[drag.rod].find(o=>o.id===drag.id);if(obj)alignTo(xy.x,xy.y,{obj,rod:drag.rod})});
function allBalanced(){return torque('top')===0&&(!puzzle.lower||torque('lower')===0)}
function checkSolved(){if(solved)return;if(allBalanced()){solved=true;winAt=performance.now();beams.forEach(()=>{});celebration=Array.from({length:18},(_,i)=>({x:20+Math.random()*(W-40),y:H*.5+Math.random()*H*.25,delay:Math.random()*.4,a:Math.random()*Math.PI*2,r:2+Math.random()*3,c:['#27bdb2','#e6bb7d','#83d7bf','#f0d7a5'][i%4]}));$('successText').textContent=level===4?'ぜんぶ、ぴったり！':'ぴったり！';$('success').classList.add('on');$('balanceLabel').textContent='左右の力が、つりあった！';$('balanceLabel').classList.add('good');$('nextBtn').disabled=false;if(level===4)$('nextBtn').querySelector('span').textContent='もういちど';$('nextBtn').classList.add('ready');$('tutorial').classList.add('hide');winSound();try{if(navigator.vibrate)navigator.vibrate([20,35,35])}catch(_){} }
 else if(puzzle.lower&&torque('top')===0&&torque('lower')!==0){selected=puzzle.lower.find(o=>o.m)?.id||selected;$('balanceLabel').textContent='上が水平！ つぎは下のてこ';}
 else if(puzzle.lower&&torque('top')!==0&&torque('lower')===0){selected=puzzle.top.find(o=>o.m)?.id||selected;$('balanceLabel').textContent='下が水平！ つぎは上のてこ';}
 else{$('balanceLabel').textContent='まだ少し、かたむいているよ';}
}
canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;e.preventDefault();drag=null;checkSolved()});canvas.addEventListener('pointercancel',()=>{drag=null;checkSolved()});
$('nextBtn').addEventListener('click',()=>{if(!solved)return;tick();initLevel(level===4?0:level+1)});$('prevBtn').addEventListener('click',()=>{if(level===0)return;tick();initLevel(level-1)});$('resetBtn').addEventListener('click',()=>{tick();initLevel(level)});$('hintBtn').addEventListener('click',()=>{hintOn=!hintOn;$('subtitle').textContent=hintOn?puzzle.hint:puzzle.sub;if(!solved){$('tutorial').classList.toggle('hide',hintOn||tutorialHidden);if(!hintOn&&!tutorialHidden)$('tutorial').textContent=puzzle.tip}tick()});$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('moment.mobile.sound',soundOn?'on':'off')}catch(_){}updateSoundIcon();if(soundOn)tick()});
function updateSoundIcon(){$('soundIcon').innerHTML=soundOn?'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6a8 8 0 0 1 0 12"/>':'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6m0-6-5 6"/>';}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));document.addEventListener('visibilitychange',()=>{animPrev=performance.now()});window.addEventListener('keydown',e=>{const sel=getSelected();if(!sel||solved)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const opts=eligible(sel.obj,sel.rod).sort((a,b)=>a-b);const next=(e.key==='ArrowLeft'?opts.filter(v=>v<sel.obj.p).pop():opts.find(v=>v>sel.obj.p));if(next!==undefined)moved(sel.obj,sel.rod,next);checkSolved()}});
updateSoundIcon();initLevel(level);requestAnimationFrame(drawLoop);
// Read-only developer probes for checking arithmetic, state and stage transitions.
window.__momentQA={get handles(){return beams.filter(o=>o.obj.m).map(o=>({id:o.obj.id,rod:o.rod,anchor:o.anchor,center:o.center}))},get bars(){return {top:{...bar0},lower:{...bar1}}},levels:JSON.parse(JSON.stringify(levels)),get state(){return {level,solved,top:torque('top'),lower:puzzle.lower?torque('lower'):null,puzzle:JSON.parse(JSON.stringify(puzzle))}},go(i){initLevel(i)},setPos(id,p){for(let rod of ['top','lower'])if(puzzle[rod]){let o=puzzle[rod].find(o=>o.id===id);if(o&&o.m){o.p=p;return true}}return false},check:checkSolved};
})();
